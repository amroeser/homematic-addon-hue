<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Philips Hue</title>
<style>
@font-face {
	font-family: "Instrument Sans";
	src: url("fonts/instrument-sans.woff2") format("woff2");
	font-weight: 400 700;
	font-stretch: 75% 100%;
	font-display: swap;
}
/* Tokens. Neutral graphite, one accent: filament amber for "on" and the main action.
   The lamp colour itself is the only other colour on the page. */
:root {
	--canvas: #f2f3f5;
	--surface: #ffffff;
	--raised: #ffffff;
	--ink: #16181d;
	--ink-2: #5a606b;
	--ink-3: #8a909b;
	--line: #e3e5ea;
	--fill: #eceef2;
	--fill-2: #e1e4e9;
	--amber: #e8932a;
	--amber-ink: #241503;
	--amber-soft: #fbead3;
	--ok: #2b8a57;
	--ok-soft: #dff2e7;
	--bad: #c8402f;
	--bad-soft: #fbe3df;
	--scrim: rgba(18, 20, 26, .38);
	--shadow-sheet: 0 30px 80px rgba(18, 20, 26, .28);
	--r-lg: 20px;
	--r-md: 14px;
	--r-sm: 10px;
	--ease: cubic-bezier(.22, 1, .36, 1);
	--ease-in: cubic-bezier(.55, 0, .75, .2);
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root {
		--canvas: #191b20;
		--surface: #22252b;
		--raised: #2a2d34;
		--ink: #eef0f3;
		--ink-2: #a5abb6;
		--ink-3: #757c88;
		--line: #33373f;
		--fill: #2d3138;
		--fill-2: #383c45;
		--amber: #f0a040;
		--amber-ink: #1f1203;
		--amber-soft: #3d2a12;
		--ok: #5cc98b;
		--ok-soft: #1d3a2a;
		--bad: #ff7b6b;
		--bad-soft: #43221d;
		--scrim: rgba(0, 0, 0, .55);
		--shadow-sheet: 0 30px 80px rgba(0, 0, 0, .6);
		color-scheme: dark;
	}
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
	margin: 0; background: var(--canvas); color: var(--ink);
	font: 400 15px/1.5 "Instrument Sans", system-ui, "Segoe UI", Roboto, sans-serif;
	font-stretch: 100%; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--amber) 70%, transparent); outline-offset: 2px; border-radius: 6px; }
svg { flex: none; }

/* Type scale: 13 / 15 / 17 / 22 / 34 */
.t-title { font-size: 2.125rem; line-height: 1.08; letter-spacing: -.025em; font-weight: 650; font-stretch: 92%; margin: 0; }
.t-h2 { font-size: 1.375rem; line-height: 1.2; letter-spacing: -.015em; font-weight: 620; margin: 0; }
.t-h3 { font-size: 1.0625rem; line-height: 1.3; letter-spacing: -.01em; font-weight: 600; margin: 0; }
.t-small { font-size: .8125rem; line-height: 1.4; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ shell */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.rail {
	position: sticky; top: 0; height: 100vh; padding: 22px 14px; display: flex; flex-direction: column; gap: 4px;
	border-right: 1px solid var(--line); background: var(--canvas);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; }
.brand-mark { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6e0, var(--amber) 55%, #b9661a); box-shadow: 0 0 18px color-mix(in srgb, var(--amber) 55%, transparent); }
.brand b { font-weight: 650; letter-spacing: -.01em; }
.brand small { display: block; color: var(--ink-3); font-size: .75rem; }
.nav-item {
	display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; text-align: left;
	padding: 10px 12px; border-radius: var(--r-sm); color: var(--ink-2); font-weight: 520;
	transition: background-color 160ms var(--ease), color 160ms var(--ease);
}
.nav-item:hover { background: var(--fill); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.nav-item .badge { margin-left: auto; }
.rail-foot { margin-top: auto; padding: 10px 12px; display: grid; gap: 8px; }
.rail-foot select { width: 100%; }

main { padding: 28px clamp(16px, 4vw, 48px) 120px; max-width: 1180px; width: 100%; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head .grow { flex: 1; min-width: 200px; }
.page-head p { margin: 6px 0 0; }

/* Phone: bottom tab bar */
@media (max-width: 760px) {
	.app { grid-template-columns: 1fr; }
	.rail {
		position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 20; flex-direction: row; gap: 0;
		padding: 6px 6px max(6px, env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--line);
		background: color-mix(in srgb, var(--canvas) 86%, transparent);
		-webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
	}
	.brand, .rail-foot { display: none; }
	.nav-item { position: relative; flex-direction: column; gap: 3px; padding: 6px 2px; font-size: .6875rem; text-align: center; justify-content: center; }
	.nav-item[aria-current="page"] { background: none; box-shadow: none; color: var(--ink); }
	.nav-item[aria-current="page"] svg { color: var(--amber); }
	.nav-item .badge { position: absolute; top: 0; left: 50%; margin: 0 0 0 8px; padding: 0 6px; }
	main { padding-top: 18px; }
	.t-title { font-size: 1.75rem; }
}

/* ------------------------------------------------------------------ controls */
.btn {
	display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 16px;
	border: 0; border-radius: 999px; background: var(--fill); color: var(--ink); font-weight: 560; white-space: nowrap; text-decoration: none;
	transition: transform 90ms ease-out, background-color 160ms var(--ease), opacity 160ms;
}
.btn:hover { background: var(--fill-2); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn.primary { background: var(--amber); color: var(--amber-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--amber) 88%, #fff); }
.btn.quiet { background: transparent; color: var(--ink-2); padding: 0 10px; }
.btn.quiet:hover { background: var(--fill); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: .875rem; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: 50%; }

input[type=text], input[type=search], input[type=number], input[type=password], input:not([type]), select, textarea {
	width: 100%; min-height: 42px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm);
	background: var(--surface); transition: border-color 150ms, box-shadow 150ms;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 25%, transparent); }
label.field { display: grid; gap: 6px; font-weight: 560; font-size: .875rem; }
.hint { font-weight: 400; color: var(--ink-2); font-size: .8125rem; }

/* Switch */
.switch { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 50px; height: 30px; margin: 0; border-radius: 30px; background: var(--fill-2); cursor: pointer; transition: background-color 220ms var(--ease); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: transform 220ms var(--ease); }
.switch:checked { background: var(--amber); }
.switch:checked::after { transform: translateX(20px); }
.switch:disabled { opacity: .45; cursor: default; }

/* Segmented choice */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--fill); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 9px; font-weight: 540; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* Range */
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; margin: 0; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 10px; background: var(--track, var(--fill-2)); }
input[type=range]::-moz-range-track { height: 10px; border-radius: 10px; background: var(--track, var(--fill-2)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -8px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 4px 10px rgba(0,0,0,.15); }
input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 4px 10px rgba(0,0,0,.15); }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--fill); color: var(--ink-2); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.amber { background: var(--amber-soft); color: color-mix(in srgb, var(--amber) 70%, var(--ink)); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.dot.live { animation: live 2.4s ease-out infinite; }
@keyframes live { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 60%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }

/* ------------------------------------------------------------------ notice */
.notice { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--r-md); background: var(--amber-soft); margin-bottom: 22px; }
.notice .grow { flex: 1; min-width: 220px; }
.notice p { margin: 2px 0 0; }
.notice.ok { background: var(--ok-soft); }
.notice.bad { background: var(--bad-soft); }

/* ------------------------------------------------------------------ rooms */
.room { margin-bottom: 34px; }
.room.zone { padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); margin-bottom: 14px; }
.room.zone .room-head { margin-bottom: 6px; }
.room.zone .t-h2 { font-size: 1.0625rem; }
.room-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.room-head .grow { flex: 1; min-width: 160px; }
.room-head p { margin: 2px 0 0; }
.scenes { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 520; font-size: .875rem; color: var(--ink); transition: border-color 150ms, background-color 150ms, transform 90ms; }
.chip:hover { border-color: var(--ink-3); }
.chip:active { transform: scale(.97); }
.chip.active { border-color: var(--amber); background: var(--amber-soft); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 12px; }
/* The lamp tile glows in the real colour and brightness of the lamp */
.tile {
	--lamp: 210 212 218; --glow: 0;
	position: relative; display: flex; flex-direction: column; min-height: 132px; padding: 14px 14px 12px; border-radius: var(--r-lg);
	border: 1px solid var(--line); background: var(--surface); text-align: left; overflow: hidden; isolation: isolate;
	transition: border-color 260ms var(--ease), transform 90ms ease-out, box-shadow 260ms var(--ease);
}
.tile::before {
	content: ""; position: absolute; inset: 0; z-index: -1; opacity: var(--glow); transition: opacity 420ms var(--ease), background 420ms var(--ease);
	background: radial-gradient(120% 95% at 18% 8%, rgb(var(--lamp) / .55), rgb(var(--lamp) / .16) 55%, transparent 80%);
}
.tile.on { border-color: rgb(var(--lamp) / .55); box-shadow: 0 10px 30px -14px rgb(var(--lamp) / .9); }
.tile:active { transform: scale(.985); }
.tile .bulb { width: 30px; height: 30px; border-radius: 50%; background: var(--fill-2); transition: background-color 420ms, box-shadow 420ms; display: grid; place-items: center; }
.tile.on .bulb { background: rgb(var(--lamp)); box-shadow: 0 0 0 4px rgb(var(--lamp) / .22), 0 0 22px rgb(var(--lamp) / .8); }
.tile .bulb svg { color: var(--ink-3); }
.tile.on .bulb svg { color: rgba(0,0,0,.45); }
.tile .name { margin-top: auto; padding-top: 14px; font-weight: 600; letter-spacing: -.005em; line-height: 1.25; }
.tile .state { color: var(--ink-2); font-size: .8125rem; margin-top: 2px; }
.tile.unreachable { border-style: dashed; }
/* Lamps of the CCU (Shelly, HomeMatic): plain warm light, they cannot dim or colour */
.tile.extra { --lamp: 255 206 140; }
.tile.extra.unknown .state { color: var(--ink-3); }
.extra-row { border-top: 1px solid var(--line); padding: 4px 0 10px; }
.extra-row:first-child { border-top: 0; }
.extra-row .row { padding: 8px 0; }
.extra-ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--fill-2); color: var(--ink-3); flex: none; }
.extra-ic.on { background: rgb(255 206 140); color: rgba(0,0,0,.5); box-shadow: 0 0 16px rgb(255 206 140 / .8); }
.extra-opts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-left: 44px; }
.extra-opts details { width: 100%; }
.extra-opts summary { cursor: pointer; color: var(--ink-2); font-weight: 540; padding: 6px 0; }
.extra-scene { display: flex; align-items: center; gap: 10px; padding: 6px 0; flex-wrap: wrap; }
.extra-scene .grow { min-width: 120px; }
.pick-list { margin-top: 12px; display: grid; gap: 2px; }
.pick-list h4 { margin: 10px 0 4px; font-size: .8125rem; color: var(--ink-2); font-weight: 600; }
.pick-list .row { padding: 8px 0; }
@media (max-width: 760px) { .extra-opts { padding-left: 0; } }
.tile.unreachable .state { color: var(--bad); }
.tile-wrap { position: relative; }
.tile-wrap > .tile { width: 100%; }
.tile-wrap .more { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); display: grid; place-items: center; }
.tile-wrap .more:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--ink); }
.tile-wrap .hm { position: absolute; top: 19px; right: 48px; color: var(--ok); pointer-events: none; }

@media (max-width: 760px) {
	.tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
	.tile { min-height: 112px; padding: 12px; }
	.tile .name { padding-top: 10px; font-size: .9375rem; }
	.room-head .btn.quiet { padding: 0 6px; }
}

.empty { padding: 40px 20px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r-lg); }
.empty p { margin: 6px auto 16px; max-width: 46ch; }

/* ------------------------------------------------------------------ panels (settings, diagnose, sensors) */
.panel { background: var(--surface); border-radius: var(--r-lg); border: 1px solid var(--line); margin-bottom: 20px; }
.panel > .panel-head { padding: 18px 20px 4px; }
.panel > .panel-head p { margin: 4px 0 0; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; flex-wrap: wrap; }
.row + .row { border-top: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 180px; }
.row p { margin: 2px 0 0; }
details.more-settings > summary { list-style: none; cursor: pointer; padding: 14px 20px; color: var(--ink-2); font-weight: 560; border-top: 1px solid var(--line); }
details.more-settings > summary::-webkit-details-marker { display: none; }
details.more-settings > summary::before { content: "+"; display: inline-block; width: 1.2em; font-weight: 400; }
details.more-settings[open] > summary::before { content: "–"; }
.save-bar {
	position: sticky; bottom: 18px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; margin-top: 8px;
	border-radius: 999px; background: var(--ink); color: var(--canvas); box-shadow: 0 12px 30px rgba(0,0,0,.25);
	animation: rise 320ms var(--ease);
}
.save-bar .grow { flex: 1; }
.save-bar .btn.quiet { color: color-mix(in srgb, var(--canvas) 75%, transparent); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@media (max-width: 760px) { .save-bar { bottom: 84px; } }

.check { display: flex; gap: 14px; align-items: flex-start; padding: 16px 20px; }
.check + .check { border-top: 1px solid var(--line); }
.check .mark { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--ok-soft); color: var(--ok); }
.check.bad .mark { background: var(--bad-soft); color: var(--bad); }
.check.warn .mark { background: var(--amber-soft); color: color-mix(in srgb, var(--amber) 75%, var(--ink)); }
.check .grow { flex: 1; min-width: 0; }
.check p { margin: 2px 0 0; }
pre { margin: 0; padding: 14px; border-radius: var(--r-sm); background: var(--fill); overflow: auto; max-height: 50vh; font: .8125rem/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.examples { display: flex; gap: 6px; flex-wrap: wrap; }

/* Flows: three columns joined by curves */
.flow-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 16px; }
.flow-bar .badge svg { width: 14px; height: 14px; }
.flow-wrap { overflow-x: auto; padding-bottom: 8px; }
.flow-canvas { position: relative; display: grid; grid-template-columns: minmax(230px, 1fr) minmax(210px, .9fr) minmax(200px, 1fr); column-gap: 150px; min-width: 980px; padding: 4px 0 24px; }
.flow-lines { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.flow-lines .edge { fill: none; stroke: color-mix(in srgb, var(--amber) 55%, var(--line)); stroke-width: 1.6; }
.flow-lines .edge.warn { stroke: var(--bad); stroke-dasharray: 5 4; }
.flow-lines .edge.dashed { stroke-dasharray: 3 4; stroke: var(--ink-3); }
.flow-lines text { font-size: 11px; fill: var(--ink-2); paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; }
.flow-col { display: grid; gap: 10px; align-content: start; position: relative; z-index: 1; }
.flow-col-head { font-size: .8125rem; font-weight: 600; color: var(--ink-2); padding: 0 2px 2px; }
.flow-node { display: grid; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); text-align: left; color: var(--ink); }
.flow-node .flow-name { font-weight: 600; line-height: 1.3; }
.flow-node .flow-meta { font-size: .75rem; color: var(--ink-2); }
.flow-node.prog { border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); cursor: pointer; }
.flow-node.prog:hover { box-shadow: 0 6px 18px -10px rgb(232 147 42 / .8); }
.flow-node.prog.off { opacity: .55; }
.flow-node.prog.warn { border-color: var(--bad); }
.flow-node.prog.warn .flow-meta { color: var(--bad); }
.flow-node.prog.drop { outline: 2px solid var(--amber); outline-offset: 2px; }
.flow-node.trigger.cond { border-style: dashed; }
.flow-port { display: flex; align-items: center; gap: 8px; font-size: .8125rem; color: var(--ink-2); padding: 3px 0; cursor: grab; }
.flow-port .dot, .flow-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); flex: none; box-shadow: 0 0 0 3px var(--amber-soft); }
.flow-dot.target { background: var(--ink-3); box-shadow: 0 0 0 3px var(--fill); }
.flow-node.trigger.cond .flow-port { cursor: default; }
.flow-add { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 0 2px; }
.flow-list { display: none; gap: 10px; }
.flow-card { display: grid; gap: 4px; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--ink); }
.flow-card.warn { border-color: var(--bad); }
.flow-card .flow-name { font-weight: 600; }
@media (max-width: 760px) { .flow-wrap { display: none; } .flow-list { display: grid; } }
/* flow editor: triggers -> condition -> yes/no -> actions */
dialog.xl { width: min(1240px, calc(100vw - 32px)); }
.fe-body { display: grid; gap: 14px; }
.fe-top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.fe-name { flex: 1; min-width: 200px; font-size: 1.05rem; font-weight: 600; }
.fe-active { display: flex; gap: 8px; align-items: center; font-weight: 560; }
.fe-split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.fe-main { display: grid; gap: 12px; min-width: 0; }
.fe-main .notice { margin: 0; }
.fe-main .notice.tip { background: var(--fill); }
.fe-main .notice > span:first-child { align-self: flex-start; margin-top: 3px; }
.fe-scroll { overflow-x: auto; padding-bottom: 6px; }
.fe-canvas { position: relative; display: grid; grid-template-columns: minmax(190px, 1fr) minmax(200px, 1fr) minmax(200px, 1fr); column-gap: 56px; min-width: 700px; padding: 10px; border-radius: var(--r-md); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 18px 18px; }

.fe-node.sel { outline: 2px solid var(--amber); outline-offset: 2px; }
.fe-node.ok { box-shadow: inset 0 0 0 1px var(--ok); }
.fe-node.no { box-shadow: inset 0 0 0 1px var(--bad); }
.fe-title { font-weight: 600; line-height: 1.3; font-size: .9rem; }
.fe-sub { font-size: .75rem; color: var(--ink-2); }
.fe-pass { font-size: .8125rem; color: var(--ink-3); padding: 10px 0; }

.fe-badge.yes, .fe-badge.no { background: var(--fill-2); color: var(--ink); }

.fe-add:hover { border-color: var(--amber); color: var(--ink); }
.fe-add.small { padding: 3px 8px; font-size: .75rem; }
.fe-lines { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 0; }
.fe-lines .edge { fill: none; stroke: color-mix(in srgb, var(--ink-3) 60%, transparent); stroke-width: 1.6; }
.fe-lines .edge.dashed { stroke-dasharray: 5 4; }
.fe-more { grid-column: 1 / -1; }
.fe-sentence { font-size: .875rem; color: var(--ink-2); padding: 12px 14px; border-radius: var(--r-md); background: var(--fill); }
.fe-sentence p { margin: 2px 0; }
.fe-inspect { position: sticky; top: 0; display: grid; gap: 12px; align-content: start; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.fe-ihead { display: flex; align-items: center; gap: 8px; }
.fe-ihead .grow { flex: 1; }
.fe-form { display: grid; gap: 10px; }
.fe-form select, .fe-form input:not([type=checkbox]):not([type=range]) { width: 100%; }
.fe-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fe-row input, .fe-row select { width: auto !important; }
.fe-days { display: flex; gap: 6px; flex-wrap: wrap; }
.fe-days label { display: flex; gap: 4px; align-items: center; font-size: .8125rem; }
.fe-groups { display: grid; gap: 6px; }
.fe-group { display: grid; gap: 6px; padding: 8px; border-radius: 10px; background: var(--fill); }
.fe-join { font-size: .75rem; font-weight: 700; color: var(--ink-2); text-transform: uppercase; }
.fe-join.small { font-weight: 600; text-transform: none; }
.fe-item summary { cursor: pointer; font-size: .875rem; font-weight: 560; }
.fe-item[open] { padding-bottom: 6px; }
.fe-addrow { display: flex; gap: 8px; flex-wrap: wrap; }
.fe-check { display: flex; gap: 8px; align-items: center; font-size: .8125rem; color: var(--ink-2); }
@media (max-width: 900px) { .fe-split { grid-template-columns: 1fr; } .fe-inspect { position: static; } }
@media (max-width: 640px) { .fe-canvas { grid-template-columns: 1fr; min-width: 0; row-gap: 14px; background: none; padding: 0; } .fe-lines { display: none; } }
.sys-dev { display: flex; align-items: center; gap: 10px; padding: 6px 0; flex-wrap: wrap; }
.sys-dev .grow { min-width: 160px; }
.badge.warn { background: var(--amber-soft); color: var(--ink); }
.sensor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

.sensor .reading { display: grid; gap: 2px; padding: 10px 0; min-width: 0; }

.sensor .var i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex: none; }
.sensor .var.ok { color: var(--ink-2); }
.sensor .var.ok i { background: var(--ok); }
.sensor .reading + .reading { border-top: 1px solid var(--line); }
.sensor .value { font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; }

/* ------------------------------------------------------------------ sheets */
dialog {
	border: 0; padding: 0; color: var(--ink); background: var(--raised); border-radius: 24px; box-shadow: var(--shadow-sheet);
	width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow: hidden;
}
dialog::backdrop { background: var(--scrim); }
dialog[open] { animation: sheet-in 360ms var(--ease); }
dialog[open]::backdrop { animation: fade 280ms ease-out; }
dialog.closing { animation: sheet-out 200ms var(--ease-in) forwards; }
dialog.closing::backdrop { animation: fade-out 200ms ease-in forwards; }
@keyframes sheet-in { from { opacity: 0; transform: translateY(18px) scale(.97); } }
@keyframes sheet-out { to { opacity: 0; transform: translateY(18px) scale(.97); } }
@keyframes fade { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
.sheet { display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; padding: 22px 22px 8px; }
.sheet-head .grow { flex: 1; min-width: 0; }
.sheet-head p { margin: 3px 0 0; }
.sheet-body { padding: 8px 22px 22px; overflow: auto; }
.sheet-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 22px 20px; border-top: 1px solid var(--line); }
.section { padding: 16px 0; }
.section + .section { border-top: 1px solid var(--line); }
.section > .t-h3, .section > summary { margin-bottom: 10px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); transition: transform 90ms ease-out; }
.swatch:active { transform: scale(.92); }
.swatch.custom { background: conic-gradient(#ff4d4d, #ffd84d, #6bff6b, #4dd8ff, #6b6bff, #ff6bff, #ff4d4d); position: relative; overflow: hidden; cursor: pointer; }
.swatch.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.big-toggle { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r-md); background: var(--fill); }
.big-toggle .grow { flex: 1; }
.kv { display: grid; grid-template-columns: max-content 1fr auto; gap: 8px 14px; align-items: center; font-size: .875rem; margin-top: 12px; }
.kv code { font: .8125rem ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
.choice { display: grid; gap: 8px; }
.choice button { display: grid; grid-template-columns: 22px 1fr; gap: 2px 10px; text-align: left; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.choice button[aria-checked="true"] { border-color: var(--amber); background: var(--amber-soft); }
.choice .radio { width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--ink-3); }
.choice button[aria-checked="true"] .radio { border: 6px solid var(--amber); }
.choice small { grid-column: 2; color: var(--ink-2); }
@media (max-width: 640px) {
	dialog { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 24px 24px 0 0; max-height: 92vh; }
	.sheet { max-height: 92vh; }
	dialog[open] { animation: up 380ms var(--ease); }
	dialog.closing { animation: down 240ms var(--ease-in) forwards; }
	@keyframes up { from { transform: translateY(100%); } }
	@keyframes down { to { transform: translateY(100%); } }
	.sheet-foot .btn { flex: 1; }
}

/* ------------------------------------------------------------------ onboarding */
.onboard { max-width: 640px; margin: 4vh auto 0; }
.steps { display: flex; gap: 8px; margin: 18px 0 26px; padding: 0; }
.steps li { flex: 1; list-style: none; padding-top: 10px; border-top: 3px solid var(--fill-2); color: var(--ink-3); font-size: .8125rem; font-weight: 560; }
.steps li.done, .steps li.now { border-color: var(--amber); color: var(--ink); }
.press { display: grid; place-items: center; gap: 14px; padding: 22px 0 8px; text-align: center; }
.press p { margin: 0; }
.ring { --p: 1; width: 148px; height: 148px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--amber) calc(var(--p) * 360deg), var(--fill-2) 0); }
.ring .inner { width: 124px; height: 124px; border-radius: 50%; background: var(--canvas); display: grid; place-items: center; }
.ring .bridge { width: 70px; height: 70px; border-radius: 18px; background: var(--surface); display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line), 0 6px 16px rgba(0,0,0,.08); }
.ring .button { width: 26px; height: 26px; border-radius: 50%; background: var(--fill); box-shadow: 0 0 0 2px var(--amber); animation: push 1.6s var(--ease) infinite; }
@keyframes push { 0%, 60%, 100% { transform: scale(1); } 30% { transform: scale(.82); } }
.found { display: grid; gap: 8px; margin: 12px 0; }
.found button { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); text-align: left; font-weight: 560; }
.found button:hover { border-color: var(--amber); }
.found button .grow { flex: 1; }
.big-mark { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); }
.big-mark svg { width: 26px; height: 26px; }

/* ------------------------------------------------------------------ guide */
.tour { text-align: left; }
.tour-art { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px 0 22px; flex-wrap: wrap; }
.tour-node { padding: 10px 12px; border-radius: var(--r-md); background: var(--fill); font-weight: 600; font-size: .8125rem; text-align: center; }
.tour-node.addon { background: var(--amber-soft); }
.tour-arrow { color: var(--ink-3); font-size: 1.2rem; }
.tour-room { display: grid; grid-template-columns: repeat(3, 34px); gap: 8px; padding: 14px; border-radius: var(--r-md); background: var(--fill); }
.tour-room span { width: 34px; height: 34px; border-radius: 50%; background: #ffd08a; box-shadow: 0 0 16px #ffb85c; }
.tour-list { display: grid; gap: 6px; padding: 12px 14px; border-radius: var(--r-md); background: var(--fill); min-width: 230px; font-size: .875rem; }
.tour-list b { font-weight: 600; }
.tour-list .sel { padding: 4px 8px; border-radius: 8px; background: var(--amber-soft); }
.tour p { margin: 0 0 12px; }
.tour .example { padding: 10px 12px; border-left: 3px solid var(--amber); background: var(--fill); border-radius: 0 var(--r-sm) var(--r-sm) 0; margin-bottom: 8px; font-size: .9375rem; }
.dots { display: flex; gap: 6px; margin-right: auto; align-items: center; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--fill-2); }
.dots i.on { background: var(--amber); width: 20px; border-radius: 4px; }

/* ------------------------------------------------------------------ toast */
#toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; display: grid; gap: 8px; justify-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
#toast div { pointer-events: auto; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--canvas); font-weight: 520; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: rise 300ms var(--ease); }
#toast div.bad { background: var(--bad); color: #fff; }
#toast div.leave { animation: fade-out 200ms ease-in forwards; }
@media (max-width: 760px) { #toast { bottom: 92px; } }

@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}
@media (prefers-contrast: more) {
	:root { --line: var(--ink-2); --ink-2: var(--ink); }
}
</style>
</head>

	S.flows = f.programs; S.catalog = c;
	// Direct links take a few seconds on the CCU: load them on their own
	if (!S.links || force) rest("GET", "flows/links").then(ls => {
		const m = {};
		for (const l of ls || []) (m[l.sender] = m[l.sender] || []).push(String(l.name || l.receiver).replace(/^.* (mit|with) /, ""));
		S.links = m;

}
const pressLabel = p => ({ SHORT: t("fl_short"), LONG_START: t("fl_long"), LONG: t("fl_long_rep") })[p] || "";

// Switch and toggle of one lamp are one target; system variables have no channel

function flowLogic(p) {
	const num = v => { const f = parseFloat(v); return isNaN(f) ? v : String(Math.round(f * 100) / 100).replace(".", lang === "de" ? "," : "."); };
	const val = v => v === "true" ? t("fl_on") : v === "false" ? t("fl_off") : num(v);
	// Comparison types of the CCU: 5 equal, 7 range, 8 greater, 9 at least, 10 less, 11 at most, 12 not equal
	const cmp = s => ({ "8": "> ", "9": "≥ ", "10": "< ", "11": "≤ ", "12": "≠ " })[s.ct] || (s.ct === "7" ? "" : "= ");
	const single = s => s.press ? keyName(s).device + ", " + keyName(s).key + " " + pressLabel(s.press)
		: cleanName(s.channel_name || s.name) + " " + condLabel(s).replace(/ \(.*\)$/, "") + " " + cmp(s)
			+ (s.ct === "7" ? val(s.value) + " – " + val(s.value2) : val(s.value)) + (s.ct2 === "15" ? " (" + t("fl_only_check").replace(":", "") + ")" : "");
	return h("div", { class: "flow-logic" }, p.rules.map((r, ri) => {
		const conds = r.conditions.map(c => c.singles.map((s, k) => (k ? (s.op === "2" ? " " + t("fl_or") + " " : " " + t("fl_and") + " ") : "") + single(s)).join(""));
		const join = " " + ((r.conditions[1] || {}).op === "1" ? t("fl_and") : t("fl_or")) + " ";
		const when = conds.length > 1 ? conds.map(c => "(" + c + ")").join(join) : conds[0];
		const acts = r.actions.map(a => targetName(a) + " " + actionText(a) + (a.delay_type && a.delay_type !== "0" ? " (" + t("fl_delayed") + ")" : "")).join(", ");
		return h("p", { style: "margin:6px 0" }, h("b", {}, ri === 0 ? t("fl_when") : when ? t("fl_else_if") : t("fl_else")), " ", when || "", when ? h("br") : null,

}
function targetKey(a) { return a.channel && a.channel !== "65535" && a.channel !== "0" ? "ch" + a.channel : "dp" + a.dp; }
function targetOf(dp) { return (S.catalog.targets || []).find(x => x.dp === dp || x.toggle === dp); }
function actionText(a) {

// Checks across all programs: keys used twice, conflicting actions for one key, direct links,
// loops, programs without trigger, and tips. Works on the overview data and on the draft
// in the editor (then the draft replaces its program, and tips can fix the draft).
function flowSummary(p) {
	const branches = p.rules.filter((r, i) => i === 0 || r.conditions.length).map(r => ({
		items: r.conditions.flatMap(c => c.singles).map(s => ({ dp: s.dp, press: s.press, ct2: String(s.ct2), name: s.name, ch: s.channel, label: s.press ? keyName(s).device + ", " + keyName(s).key + " " + pressLabel(s.press) : cleanName(s.channel_name || s.name) })),
		acts: r.actions.map(a => ({ dp: a.dp, value: a.value, channel: a.channel, name: a.name, channel_name: a.channel_name, delay: a.delay_type === "28" ? String(a.delay || "").slice(-8) : "" }))

		branches: d.branches.map(b => ({

			acts: b.then.map(a => ({ dp: a.dp, value: a.value, channel: a.ch, name: a.name, channel_name: a.channel_name, delay: a.delay })) })) };
}
function flowAnalysis(draft) {
	const sums = (S.flows || []).filter(p => !draft || p.id !== draft.id).map(flowSummary);
	if (draft) sums.push(draftSummary(draft));
	const out = new Map(), add = (id, x) => out.set(id, [...(out.get(id) || []), x]);
	const actText = a => FE.actText(Object.assign({ ch: a.channel }, a));
	const tkey = a => targetKey({ channel: a.channel, dp: a.dp });
	const isTrig = it => it.ct2 !== "15";
	// Keys: programs per key datapoint (all branches), and the actions they start first
	const byKey = new Map();
	for (const s of sums) {
		if (!s.active && !s.draft) continue;
		for (const it of s.branches.flatMap(b => b.items)) if (it.press) {
			if (!byKey.has(it.dp)) byKey.set(it.dp, { label: it.label, name: it.name, list: [] });
			if (!byKey.get(it.dp).list.includes(s)) byKey.get(it.dp).list.push(s);
		}
	}
	for (const [dp, k] of byKey) {
		if (k.list.length < 2) continue;
		for (const s of k.list) add(s.id, { level: "warn", title: t("fl_twice_title"), text: t("fe_w_twice", { key: k.label, names: k.list.filter(x => x !== s).map(x => x.name).join(", ") }) });
		// Same key, same target, different value: the result depends on the order
		for (let i = 0; i < k.list.length; i++) for (let j = i + 1; j < k.list.length; j++) {
			const A = k.list[i], B = k.list[j];
			for (const a of A.branches[0].acts) for (const b of B.branches[0].acts) {
				if (tkey(a) !== tkey(b)) continue;
				const tg = FE.targetOf(a);
				const toggles = tg && tg.toggle && a.dp === tg.toggle && b.dp === tg.toggle;
				if (!toggles && (a.dp + "=" + a.value) === (b.dp + "=" + b.value)) continue;
				// Two toggles of one target cancel each other out
				const txt = toggles ? t("fe_w_toggle2", { key: k.label, a: A.name, b: B.name, x: FE.label(tg.name) })
					: t("fe_w_conflict", { key: k.label, a: A.name, x: actText(a), b: B.name, y: actText(b) });
				add(A.id, { level: "warn", title: t("fe_w_conflict_title"), text: txt });

			const tr = (S.catalog.triggers || []).find(x => x.channel === it.ch || x.long === it.dp);
			add(s.id, { level: "warn", title: t("fl_repeat_title"), text: t("fl_repeat_text"),
				fix: s.draft && tr && tr.long && tr.long !== it.dp ? [t("fl_repeat_fix"), d => { for (const br of d.branches) for (const g of br.when.groups) for (const x of g) if (x.dp === it.dp) Object.assign(x, { dp: tr.long, press: "LONG_START", name: String(x.name).replace(/PRESS_LONG$/, "PRESS_LONG_START") }); }] : null });
		}
		// Key also linked directly to an actuator: it switches twice
		if (S.links) {
			const done = new Set();
			for (const it of items) if (it.press) {
				const addr = String(it.name || "").replace(/\.PRESS_\w+$/, "");
				const l = S.links[addr];
				if (!l || !l.length || done.has(addr)) continue;
				done.add(addr);
				const k = keyName({ channel_name: it.label.split(",")[0] + ":" + ((/:(\d+)$/.exec(addr) || [])[1] || "") });
				add(s.id, { level: "warn", title: t("fe_w_link_title"), text: t("fe_w_link", { key: k.device + ", " + k.key, to: l.map(x => FE.label(x)).join(", ") }) });
			}
		}
		// Never starts by itself
		if (!b0.items.some(isTrig)) add(s.id, { level: "warn", title: t("fe_w_notrig_title"), text: t("fe_w_notrig") });
		// A value that starts the program and is switched by it: it can start itself again
		for (const it of items) if (isTrig(it) && !it.press && it.ch) {
			const hit = s.branches.flatMap(b => b.acts).find(a => a.channel === it.ch);
			if (hit) add(s.id, { level: "tip", title: t("fe_w_loop_title"), text: t("fe_w_loop", { x: it.label }) });
		}

		const d = s.draft;
		const checks0 = b0.items.filter(x => !isTrig(x));
		const tgt = b0.acts.length === 1 && FE.targetOf(b0.acts[0]);
		if (checks0.length === 1 && s.branches.length === 1 && s.hasElse && tgt && tgt.toggle && checks0[0].ch === b0.acts[0].channel) {
			const elseActs = d ? d.else.then : ((S.flows.find(p => p.id === s.id) || { rules: [] }).rules.slice(1).find(r => !r.conditions.length) || { actions: [] }).actions;
			if (elseActs.length === 1 && elseActs[0].dp === b0.acts[0].dp && elseActs[0].value !== b0.acts[0].value)
				add(s.id, { level: "tip", title: t("fe_t_toggle_title"), text: t("fe_t_toggle", { x: FE.label(tgt.name) }),
					fix: d ? [t("fe_t_toggle_fix"), dr => {
						const v = FE.view(dr.branches[0]);
						dr.branches[0].when = FE.rebuild(v.triggers, { op: "or", groups: [] });
						dr.branches[0].then = [Object.assign(FE.newAction(tgt), { dp: tgt.toggle, value: "true", name: tgt.name + ".TOGGLE" })];
						dr.else = null;
					}] : null });
		}
		// Tip: a condition that starts the program while there is an "else"
		const keyTrig = b0.items.some(x => x.press);
		const valTrig = b0.items.filter(x => isTrig(x) && !x.press);
		if (s.hasElse && keyTrig && valTrig.length)
			add(s.id, { level: "tip", title: t("fe_t_checkonly_title"), text: t("fe_t_checkonly", { x: valTrig.map(x => x.label).join(", ") }),
				fix: d ? [t("fe_t_checkonly_fix"), dr => { for (const g of dr.branches[0].when.groups) for (const x of g) if (!x.press && String(x.ct2) !== "15") x.ct2 = "15"; }] : null });

		for (const b of s.branches) {
			const rooms = {};
			for (const a of b.acts) { const tg = FE.targetOf(a); if (tg && tg.group === "hue_light" && tg.room) rooms[tg.room] = (rooms[tg.room] || 0) + 1; }
			for (const [r, n] of Object.entries(rooms)) if (n >= 3) add(s.id, { level: "tip", title: t("fe_t_room_title"), text: t("fe_t_room", { r, n }) });
		}
		// Tip: devices without a room in the CCU (suggestions and search need it)
		const noRoom = [...new Set(s.branches.flatMap(b => b.acts).map(a => FE.targetOf(a)).filter(tg => tg && tg.kind !== "scene" && tg.kind !== "sysvar" && !tg.room && !(tg.rooms || []).length).map(tg => FE.tgLabel(tg)))];
		if (noRoom.length) add(s.id, { level: "tip", title: t("fe_t_noroom_title"), text: t("fe_t_noroom", { x: noRoom.join(", ") }) });
		// Tip: delays without stopping the old ones
		if (d) d.branches.concat(d.else ? [d.else] : []).forEach(b => {
			if (b.stop_delays === false && b.then.some(a => a.delay)) add(s.id, { level: "tip", title: t("fe_t_delay_title"), text: t("fe_t_delay"),
				fix: [t("fe_t_delay_fix"), dr => { for (const x of dr.branches.concat(dr.else ? [dr.else] : [])) if (x.then.some(a => a.delay)) x.stop_delays = true; }] });

	for (const [id, xs] of out) out.set(id, xs.filter((x, i) => xs.findIndex(y => y.text === x.text) === i));

}

		for (const e of edges) {
			const a = get(e.from), b = get(e.to);

			const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
			const oi = outI.get(e.from) || 0, ii = inI.get(e.to) || 0;

	if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.page === "flows") draw(); });
}

/* ====================================================================== flow editor */
// One CCU program as flow: triggers -> condition -> yes/no -> actions, see docs/FLOW_BUILDER.md.
// The flow keeps the raw CCU fields of every condition and action, so an unchanged flow is
// written back exactly as it was. A branch is rebuilt only after it was edited.

const FE = {
	isTrig: it => String(it.ct2) !== "15",
	key: it => [it.lvt, it.dp, it.ct, it.ct2, it.rv1, it.rv2, JSON.stringify(it.tm || "")].join("|"),
	inv: op => op === "and" ? "2" : "1",
	// Display name: "Kueche_Wandlampe:2" -> "Wandlampe" (in Küche) or "Küche Wandlampe"
	label(name, room, keepKey) {
		let n = String(name || "").replace(/\.(PRESS_\w+|STATE|LEVEL|TOGGLE|MOTION|PRESENCE_DETECTION_STATE|ILLUMINATION|CURRENT_ILLUMINATION|ACTUAL_TEMPERATURE|HUMIDITY)$/, "");
		const m = /:(\d+)$/.exec(n);
		n = n.replace(/:\d+$/, "").replace(/_/g, " ").replace(/\s+/g, " ").trim();
		if (room) {
			const fold = s => s.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/[^a-z0-9]/g, "");
			const first = n.split(" ")[0];
			if (n.includes(" ") && fold(first) === fold(room)) n = n.slice(first.length + 1);
		}
		return keepKey && m ? n + ", " + t("fl_key", { n: m[1] }) : n;
	},
	// Labels that tell apart channels of one device: "Büro Taster · Kanal 8"
	uniq(list, fn) {
		const base = new Map(list.map(x => [x, fn(x)])), count = {};
		for (const l of base.values()) count[l] = (count[l] || 0) + 1;
		for (const [x, l] of base) {
			const m = /:(\d+)$/.exec(x.name || "");
			const out = /^out(\d+)$/.exec(x.sub || "");
			if (out) base.set(x, l.replace(/ – .*$/, "") + " · " + t("fe_output", { n: out[1] }) + (/ – /.test(l) ? " – " + l.split(" – ").pop() : ""));
			else if (count[l] > 1 && m) base.set(x, l + " · " + t("fe_channel", { n: m[1] }));
		}
		return base;
	},
	hhmm: secs => String(Math.floor(secs / 3600)).padStart(2, "0") + ":" + String(Math.floor(secs % 3600 / 60)).padStart(2, "0"),
	secs: hm => { const m = /^(\d{1,2}):(\d{2})/.exec(hm || ""); return m ? Math.min(86399, +m[1] * 3600 + +m[2] * 60) : -1; },
	days: ["fe_mo", "fe_tu", "fe_we", "fe_th", "fe_fr", "fe_sa", "fe_su"],
	tmText(tm) {
		const parts = [];
		if (+tm.type === 5) {
			const wd = +tm.wd;
			parts.push(wd === 31 ? t("fe_workdays") : wd === 96 ? t("fe_weekend") : FE.days.filter((d, i) => wd & (1 << i)).map(d => t(d)).join(", ") || t("fe_weekly"));
		} else parts.push(+tm.wd === 31 ? t("fe_workdays") : +tm.wd === 96 ? t("fe_weekend") : t("fe_daily"));
		if (+tm.rep > 1) parts.push(t(+tm.type === 5 ? "fe_every_weeks" : "fe_every_days", { n: tm.rep }));
		if (+tm.sot === 3) parts.push(t("fe_day"));
		else if (+tm.sot === 6) parts.push(t("fe_night"));
		else if (+tm.time < 0) parts.push(t("fe_allday"));
		else if (+tm.dur > 0) parts.push(t("fe_from_to", { a: FE.hhmm(+tm.time), b: FE.hhmm((+tm.time + +tm.dur) % 86400) }));
		else parts.push(t("fe_at", { a: FE.hhmm(+tm.time) }));
		const d = s => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(s || ""); return m && +m[1] >= 2000 ? m[3] + "." + m[2] + "." + m[1] : ""; };
		if (d(tm.end)) parts.push(t("fe_until", { d: d(tm.end) }));
		return parts.join(", ");
	},
	cmpText(it) {
		const num = v => { const f = parseFloat(v); return isNaN(f) ? v : String(Math.round(f * 100) / 100).replace(".", lang === "de" ? "," : "."); };
		const val = v => v === "true" ? t("fe_yes") : v === "false" ? t("fe_no") : num(v);
		const ct = String(it.ct);
		if (ct === "7") return t("fe_between", { a: val(it.rv1), b: val(it.rv2) });
		return ({ "8": "> ", "9": "≥ ", "10": "< ", "11": "≤ ", "6": "≠ ", "12": "≠ " })[ct] ? ({ "8": "> ", "9": "≥ ", "10": "< ", "11": "≤ ", "6": "≠ ", "12": "≠ " })[ct] + val(it.rv1) : "= " + val(it.rv1);
	},
	condOf(it) { return (S.catalog.conditions || []).find(c => c.dp === it.dp); },
	itemText(it) {
		if (it.kind === "time") return t("fe_time") + ": " + FE.tmText(it.tm || {});
		if (it.kind === "key") { const k = keyName(it); return k.device + ", " + k.key + " " + pressLabel(it.press); }
		const c = FE.condOf(it);
		const param = c && c.param ? String(c.param).toLowerCase() : String(it.name || "").split(".").pop().toLowerCase();
		let src = it.kind === "sysvar" ? (c ? FE.srcName(c) : it.name || it.dp) : FE.label(it.channel_name || it.name || (c && c.name));
		if (it.kind === "sysvar" && c && c.values && c.values.length > 1 && /^\d+$/.test(String(it.rv1)) && String(it.ct) === "1") return src + " = " + (c.values[+it.rv1] || it.rv1);
		// Logic values in words: "Wohnzimmer Lampe ist aus", "Präsenzmelder: abwesend"
		if (/^(2|)$/.test(String(it.rt1 || "")) && /^(true|false)$/.test(String(it.rv1)) && /^(1|5)$/.test(String(it.ct)) && it.kind !== "sysvar") {
			const w = t("fe_" + it.rv1 + "_" + param);
			if (!w.startsWith("fe_")) return param === "state" ? t("fe_is", { a: src, b: w }) : src + ": " + w;
		}
		const what = t("fe_p_" + param);
		if (it.kind !== "sysvar" && !what.startsWith("fe_p_")) src += " " + what;
		return src + " " + FE.cmpText(it);
	},
	condText(ch) {
		const inner = ch.op === "or" ? "fl_and" : "fl_or", outer = ch.op === "or" ? "fl_or" : "fl_and";
		return ch.groups.map(g => g.map(FE.itemText).join(" " + t(inner) + " ")).map((s, i, a) => a.length > 1 ? "(" + s + ")" : s).join(" " + t(outer) + " ");
	},
	// Hue devices by their names in the Hue app: "Hue Wohnzimmer · Szene Ruhephase"
	tgLabel(tg) {
		if (!tg.label) return FE.label(tg.name);
		const parts = tg.label.split(" · ");
		return "Hue " + parts[0] + (parts[1] ? " · " + t("fe_scene_word") + " " + parts[1] : "");
	},
	// Hue sensor variables by the name of the sensor in the Hue app
	srcName(c) {

/* ====================================================================== bridge system */
// Cloud connection, Hue account, firmware updates and apps with access, read from the bridge
function systemPanel(b) {
	const box = h("section", { class: "panel" }, h("div", { class: "panel-head" }, h("h2", { class: "t-h3" }, t("sys_title", { name: b.name || b.id }))),

	};
	const draw = x => {
		const ok = v => v === "connected" || v === true;

			h("div", { class: "grow" }, h("div", { style: "font-weight:600" }, title), h("p", { class: "muted t-small" }, text)));

		const stateText = u.state === "installing" ? t("sys_upd_installing") : u.state === "transferring" ? t("sys_upd_loading")

		const act = async (body, msg) => {
			try { await rest("POST", "bridges/" + b.id + "/swupdate", body); toast(msg); setTimeout(load, 1500); } catch (e) { fail(e); }
		};
		const time = h("input", { type: "time", value: String(u.time || "T03:00:00").slice(1, 6), style: "width:auto", "aria-label": t("sys_auto_time"),
			onchange: e => act({ action: "auto", on: true, time: e.target.value }, t("saved")) });
		const auto = h("input", { type: "checkbox", class: "switch", role: "switch", "aria-label": t("sys_auto"), checked: u.auto === true,
			onchange: e => { time.disabled = !e.target.checked; act({ action: "auto", on: e.target.checked, time: time.value }, t("saved")); } });
		time.disabled = u.auto !== true;

		box.replaceChildren(
			h("div", { class: "panel-head" }, h("h2", { class: "t-h3" }, t("sys_title", { name: b.name || b.id })),
				h("p", { class: "muted t-small" }, t("sys_firmware", { v: x.firmware || "?", api: x.apiversion || "?" }))),
			line(ok(x.internet), t("sys_internet"), ok(x.internet) ? t("sys_internet_ok") : t("sys_internet_bad")),
			line(ok(x.account), t("sys_account"), ok(x.account) ? t("sys_account_ok") : t("sys_account_bad")),

			line(ok(x.time), t("sys_time"), ok(x.time) ? t("sys_time_ok") : t("sys_time_bad")),
			h("div", { class: "row" }, h("div", { class: "grow" }, h("div", { style: "font-weight:600" }, t("sys_updates")), h("p", { class: "muted t-small" }, stateText)),
				h("button", { class: "btn sm quiet", disabled: busy, onclick: () => act({ action: "check" }, t("sys_checking")) }, t("sys_check")),

			pending.length ? h("div", { class: "row", style: "display:block" }, pending.map(d => h("div", { class: "sys-dev" },
				h("span", { class: "grow" }, d.name, d.model ? h("span", { class: "muted" }, "  " + d.model) : null), h("span", { class: "badge" + (d.state === "ready_to_install" ? " warn" : "") }, stateLabel(d.state))))) : null,
			h("div", { class: "row" }, h("div", { class: "grow" }, h("div", { style: "font-weight:600" }, t("sys_auto")), h("p", { class: "muted t-small" }, t("sys_auto_text"))), time, auto),
			h("div", { class: "row", style: "display:block" },

				h("p", { class: "muted t-small", style: "margin:2px 0 8px" }, t("sys_apps_text")),

					h("span", { class: "muted t-small num" }, t("sys_used", { d: fmtDate(a.used) })))),
				h("a", { class: "btn sm", href: "https://account.meethue.com/apps", target: "_blank", rel: "noopener", style: "margin-top:10px" }, t("sys_manage"))),

				h("ol", { class: "muted", style: "margin:10px 0 0;padding-left:20px;line-height:1.6" }, ["sys_tenant_1", "sys_tenant_2", "sys_tenant_3", "sys_tenant_4"].map(k => h("li", {}, t(k))))));
	};
	const load = async () => {
		try { const x = await rest("GET", "bridges/" + b.id + "/system"); S.sys[b.id] = x; if (box.isConnected || !box.parentNode) draw(x); }
		catch (e) { box.replaceChildren(h("div", { class: "panel-head" }, h("h2", { class: "t-h3" }, t("sys_title", { name: b.name || b.id }))), h("div", { class: "row" }, h("p", { class: "muted" }, t("sys_failed", { e: e.message || e })))); }
	};
	if (S.sys[b.id]) draw(S.sys[b.id]);
	load();
	return box;
}

/* ====================================================================== update */
async function checkUpdate() {
	try { S.update = await rest("GET", "update/check"); } catch (e) { S.update = null; }
	const n = $("#update-notice");
	if (S.update && S.update.available) {
		n.hidden = false; n.className = "notice";
		n.replaceChildren(h("div", { class: "grow" }, h("div", { class: "t-h3" }, t("version_new", { v: S.update.installed, l: S.update.latest }))),
			h("button", { class: "btn primary", onclick: () => installUpdate(S.update) }, t("update_now")));
	} else n.hidden = true;
}
async function installUpdate(u) {
	const n = $("#update-notice");
	n.hidden = false; n.className = "notice";
	n.replaceChildren(h("div", { class: "grow t-h3" }, t("updating")));
	try { await rest("POST", "update/install"); }
	catch (e) { n.className = "notice bad"; n.replaceChildren(h("div", { class: "grow" }, t("update_failed", { e: e.message }))); return; }
	const until = Date.now() + 180000;
	await new Promise(r => setTimeout(r, 5000));
	while (Date.now() < until) {
		try { const v = await rest("GET", "version"); if (v === u.latest) { n.className = "notice ok"; n.replaceChildren(h("div", { class: "grow t-h3" }, t("updated", { v }))); setTimeout(() => location.reload(), 1500); return; } } catch (e) {}
		await new Promise(r => setTimeout(r, 3000));
	}
	n.className = "notice bad"; n.replaceChildren(h("div", { class: "grow" }, t("update_failed", { e: "/tmp/hue-update.log" })));
}

/* ====================================================================== onboarding / pairing */
function steps(n) {
	return h("ol", { class: "steps", "aria-label": "Schritte" }, [t("ob_step1"), t("ob_step2"), t("ob_step3")].map((s, i) =>
		h("li", { class: i < n ? "done" : i === n ? "now" : "", "aria-current": i === n ? "step" : null }, s)));
}
function renderOnboarding() {
	S.page = "rooms"; setNav();
	const page = $("#page-rooms");
	const stepBox = h("div");
	const body = h("div");
	page.replaceChildren(h("div", { class: "onboard" }, h("h1", { class: "t-title" }, t("ob_title")), h("p", { class: "muted" }, t("ob_text")), stepBox, body));
	pairingStep1(body, n => stepBox.replaceChildren(steps(n)), false);
}
function openPairing() {
	openSheet(() => {
		const stepBox = h("div");
		const body = h("div", { class: "sheet-body" }, stepBox);
		const inner = h("div");
		body.append(inner);

	});
}
async function pairingStep1(body, setStep, inSheet) {
	setStep(0);
	body.replaceChildren(h("p", { class: "muted" }, t("ob_search")));
	let found = [];
	try { found = await rest("GET", "discover-bridges"); } catch (e) {}
	const known = new Set(S.bridges.map(b => b.ip));
	found = found.filter(f => !known.has(f.ip));
	const ip = h("input", { placeholder: "192.168.1.20", "aria-label": t("ob_ip"), inputmode: "decimal" });
	const goManual = () => ip.value.trim() && pairingStep2(body, setStep, ip.value.trim(), 80, inSheet);
	ip.addEventListener("keydown", e => { if (e.key === "Enter") goManual(); });
	body.replaceChildren(
		found.length ? h("div", {}, h("div", { class: "t-h3" }, t("ob_found")),
			h("div", { class: "found" }, found.map(f => h("button", { onclick: () => pairingStep2(body, setStep, f.ip, f.port, inSheet) },
				h("span", { style: "width:10px;height:10px;border-radius:50%;background:var(--amber)" }), h("span", { class: "grow num" }, f.ip), h("span", { class: "muted" }, t("ob_next"))))))
			: h("p", { class: "muted" }, t("ob_none")),
		h("label", { class: "field", style: "margin-top:16px" }, t("ob_manual"), h("div", { style: "display:flex;gap:10px" }, ip,
			h("button", { class: "btn primary", onclick: goManual }, t("ob_next")))));
}
async function pairingStep2(body, setStep, ip, port, inSheet) {
	setStep(1);
	const ring = h("div", { class: "ring", "aria-hidden": "true" }, h("div", { class: "inner" }, h("div", { class: "bridge" }, h("div", { class: "button" }))));
	const text = h("p", { class: "muted num", "aria-live": "polite" });
	body.replaceChildren(h("div", { class: "press" }, ring, h("div", { class: "t-h2" }, t("ob_press")), text));
	$("#sheet").dataset.locked = "";
	const total = 30000, start = Date.now();
	let result = null, error = null;
	const tick = setInterval(() => {
		const left = Math.max(0, total - (Date.now() - start));
		ring.style.setProperty("--p", (left / total).toFixed(3));
		text.textContent = t("ob_press_text", { s: Math.ceil(left / 1000) });
	}, 200);
	while (Date.now() - start < total && !result && !error) {
		try { result = await rest("POST", "establish-link", { ip, port: parseInt(port || 80, 10) }); }
		catch (e) { if (!/link button/i.test(e.message)) error = e; else await new Promise(r => setTimeout(r, 1500)); }
	}
	clearInterval(tick);
	delete $("#sheet").dataset.locked;
	if (!result) {
		body.replaceChildren(h("div", { class: "empty" }, h("p", { class: "t-h3" }, error ? t("failed", { e: error.message }) : t("ob_timeout")),
			h("button", { class: "btn primary", onclick: () => pairingStep2(body, setStep, ip, port, inSheet) }, t("ob_again"))));
		return;
	}
	await rest("PUT", "config/bridge/" + result.bridgeid, { name: result.name, ip, port: result.port, username: result.username, clientkey: result.clientkey });
	await loadConfig();
	S.bridge = result.bridgeid;
	await loadObjects(false).catch(() => {});
	setStep(2);
	body.replaceChildren(h("div", { class: "press" },
		h("span", { class: "big-mark" }, icon("check")),
		h("div", { class: "t-h2" }, t("ob_done", { name: result.name })),
		h("p", { class: "muted" }, t("ob_done_text", { l: lights().length, r: rooms().filter(r => r.type === "room").length })),
		h("div", { style: "display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px" },
			h("button", { class: "btn", onclick: () => { if (inSheet) closeSheet(); boot(); } }, t("ob_later")),
			h("button", { class: "btn primary", onclick: async () => {
				if (inSheet) closeSheet();
				await boot();
				const btn = $("#unlinked-notice .btn.primary");
				if (btn) addAll(btn);
			} }, t("ob_add")))));
}

/* ====================================================================== guide */
const TOUR_KEY = "hue-guide-1";
function seenGuide() { try { return localStorage.getItem(TOUR_KEY) === "1"; } catch (e) { return true; } }
function markGuide() { try { localStorage.setItem(TOUR_KEY, "1"); } catch (e) {} }
$("#open-guide").addEventListener("click", () => openGuide(0));

function guideStep(i) {
	const un = unlinked().filter(x => x.type === "group");
	const sceneOn = !!(S.config.global.scene_sysvars && S.config.global.scene_sysvars.value);
	const steps = [
		() => [h("div", { class: "tour-art", "aria-hidden": "true" },
				h("div", { class: "tour-node" }, t("tour_node_hue")), h("span", { class: "tour-arrow" }, "⇄"),
				h("div", { class: "tour-node addon" }, t("tour_node_addon")), h("span", { class: "tour-arrow" }, "⇄"),
				h("div", { class: "tour-node" }, t("tour_node_hm"))),
			h("p", {}, t("tour1_x"))],
		() => [h("div", { class: "tour-art", "aria-hidden": "true" }, h("div", { class: "tour-room" }, h("span"), h("span"), h("span")), h("span", { class: "tour-arrow" }, "→"), h("div", { class: "tour-node" }, "Hue Wohnzimmer")),
			h("p", {}, t("tour2_x")),
			un.length ? h("button", { class: "btn primary", onclick: async e => { closeSheet(); setTimeout(() => { const b = $("#unlinked-notice .btn.primary"); if (b) addAll(b); }, 350); } }, t("tour2_add", { n: un.length }))
				: h("p", { class: "muted" }, t("tour2_ok"))],
		() => [h("div", { class: "tour-art", "aria-hidden": "true" }, h("div", { class: "tour-list" }, h("b", {}, "Hue Szene Wohnzimmer"), h("span", {}, "Aus"), h("span", { class: "sel" }, "Entspannen"), h("span", {}, "Konzentrieren"))),
			h("p", {}, t("tour3_x")),
			h("label", { class: "big-toggle" }, h("span", { class: "grow", style: "font-weight:600" }, t("tour3_switch")),
				h("input", { type: "checkbox", class: "switch", role: "switch", checked: sceneOn, onchange: e => setSceneVars(e.target.checked) }))],
		() => [h("p", {}, t("tour4_x")),
			h("button", { class: "btn", onclick: () => { closeSheet(); go("sensors"); } }, t("nav_sensors"))],
		() => [h("div", { class: "tour-art", "aria-hidden": "true" }, h("div", { class: "tour-room" }, h("span"), h("span"), h("span")), h("span", { class: "tour-arrow" }, "+"), h("div", { class: "tour-node" }, "Shelly")),
			h("p", {}, t("tour6_x"))],
		() => [h("p", {}, t("tour5_x")), h("div", { class: "example" }, t("tour5_a")), h("div", { class: "example" }, t("tour5_b")), h("p", { class: "muted", style: "margin-top:12px" }, t("tour5_c"))]
	];
	return steps[i]();
}
function openGuide(i) {
	const n = 6;
	const titles = ["tour1_t", "tour2_t", "tour3_t", "tour4_t", "tour6_t", "tour5_t"];
	openSheet(() => [
		sheetHead(t(titles[i])),
		h("div", { class: "sheet-body tour" }, guideStep(i)),
		h("div", { class: "sheet-foot" },

			i > 0 ? h("button", { class: "btn quiet", onclick: () => openGuide(i - 1) }, t("tour_back")) : h("button", { class: "btn quiet", onclick: () => { markGuide(); closeSheet(); } }, t("tour_skip")),
			i < n - 1 ? h("button", { class: "btn primary", onclick: () => openGuide(i + 1) }, t("tour_next"))
				: h("button", { class: "btn primary", onclick: () => { markGuide(); closeSheet(); } }, t("tour_done")))

/* ====================================================================== login, start */
function showLogin() {
	openSheet(() => {
		const u = h("input", { autocomplete: "username" }), p = h("input", { type: "password", autocomplete: "current-password" });
		const submit = async () => { try { const sid = await rest("POST", "login", { username: u.value, password: p.value }); location.href = location.pathname + "?sid=@" + sid + "@"; } catch (e) { fail(e); } };
		p.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
		return [sheetHead(t("login"), t("login_text"), false),
			h("div", { class: "sheet-body", style: "display:grid;gap:14px" }, h("label", { class: "field" }, t("username"), u), h("label", { class: "field" }, t("password"), p)),
			h("div", { class: "sheet-foot" }, h("button", { class: "btn primary", onclick: submit }, t("login")))];
	});
	$("#sheet").dataset.locked = "";
}

async function boot() {
	try { await loadConfig(); }
	catch (e) { if (e.status === 401) { showLogin(); return; } fail(e); return; }
	render();
	if (!S.bridges.length) return;
	await Promise.all([
		loadObjects(false).catch(e => { S.loadError = e; }),
		loadHued(),
		...S.bridges.map(b => rest("GET", "bridges/" + b.id + "/info").then(i => { S.apiInfo[b.id] = i.api_available; }).catch(() => { S.apiInfo[b.id] = "error"; }))
	]);
	render();
	if (!seenGuide() && S.objects) openGuide(0);
	checkUpdate().then(() => { if (S.page === "diagnose") render(); });
	startPolling();
	clearInterval(S.huedTimer);
	S.huedTimer = setInterval(async () => { if (!document.hidden) { await loadHued(); renderBadges(); } }, 15000);
}

$("#lang").value = lang;
const startPage = (location.hash || "").slice(1);
if (["rooms", "sensors", "flows", "settings", "diagnose"].includes(startPage)) S.page = startPage;
setNav();
render();
boot();
